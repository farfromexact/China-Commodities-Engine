name: Daily China Commodities Data

on:
  workflow_dispatch:
  schedule:
    # 18:15 Asia/Shanghai, Monday through Friday.
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-china-commodities
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install project
        run: python -m pip install --no-deps -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect verified four-exchange scope
        run: python -m china_commodities.cli run --exclude-exchange DCE

      - name: Upload raw option chains
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commodity-options-${{ github.run_id }}
          path: |
            data/raw/
            data/scoped/*/raw/
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate four-exchange scope
        run: python -m china_commodities.cli validate --scope ex-dce

      - name: Commit and push data changes
        shell: bash
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update daily commodity snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
