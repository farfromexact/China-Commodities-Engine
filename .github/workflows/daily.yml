name: Split EOD China Commodities Data

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD); defaults to runner date"
        required: false
        type: string
      collection_mode:
        description: "full automatically uses completed EOD before 18:15 BJT and current EOD after; night_session_only is a safe night-data canary"
        required: false
        default: full
        type: choice
        options:
          - full
          - night_session_only
  schedule:
    # 06:03 Asia/Shanghai every day: primary job is the completed prior-night
    # futures snapshot; it also retries missing EOD.
    - cron: "3 22 * * *"
    # 18:03 Asia/Shanghai every day: collect current-day domestic EOD when it
    # is available; before 18:15, safely retry the last completed EOD instead.
    - cron: "3 10 * * *"

permissions:
  contents: write

concurrency:
  group: daily-china-commodities
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install project
        run: python -m pip install --no-deps -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Plan idempotent iFinD collection
        id: collection_plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          TRADE_DATE: ${{ inputs.trade_date }}
          COLLECTION_MODE: ${{ inputs.collection_mode || 'full' }}
        run: python scripts/plan_ifind_collection.py

      - name: Acquire one shared iFinD access token
        if: ${{ steps.collection_plan.outputs.needs_ifind == 'true' }}
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        run: python scripts/export_ifind_access_token.py

      - name: Collect or sync completed domestic night-session futures snapshot
        if: ${{ steps.collection_plan.outputs.run_night_session == 'true' }}
        continue-on-error: true
        env:
          NIGHT_TRADING_DATE: ${{ steps.collection_plan.outputs.night_trading_date }}
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        shell: bash
        run: |
          python -m china_commodities.cli night-session --trade-date "${NIGHT_TRADING_DATE}"

      - name: Collect verified full-market iFinD futures
        if: ${{ steps.collection_plan.outputs.needs_futures == 'true' }}
        env:
          DOMESTIC_TRADE_DATE: ${{ steps.collection_plan.outputs.domestic_trade_date }}
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${IFIND_REFRESH_TOKEN}" ]]; then
            echo "IFIND_REFRESH_TOKEN secret is required." >&2
            exit 1
          fi
          python -m china_commodities.cli run --date "${DOMESTIC_TRADE_DATE}" --provider ifind --skip-options

      - name: Collect all catalog commodity option chains
        if: ${{ steps.collection_plan.outputs.needs_options == 'true' }}
        continue-on-error: true
        env:
          DOMESTIC_TRADE_DATE: ${{ steps.collection_plan.outputs.domestic_trade_date }}
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        shell: bash
        run: |
          python scripts/collect_ifind_options.py --all-products --date "${DOMESTIC_TRADE_DATE}" --surface-shadow-days 1

      - name: Collect pinned Physical EDB series
        if: ${{ steps.collection_plan.outputs.needs_physical == 'true' }}
        continue-on-error: true
        env:
          DOMESTIC_TRADE_DATE: ${{ steps.collection_plan.outputs.domestic_trade_date }}
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        shell: bash
        run: |
          python -m china_commodities.cli foundation --scope physical --date "${DOMESTIC_TRADE_DATE}"

      - name: Collect completed overseas daily series
        if: ${{ steps.collection_plan.outputs.needs_external == 'true' }}
        continue-on-error: true
        env:
          EXTERNAL_TRADE_DATE: ${{ steps.collection_plan.outputs.external_trade_date }}
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        shell: bash
        run: |
          python -m china_commodities.cli foundation --scope external --date "${EXTERNAL_TRADE_DATE}"

      - name: Rebuild local futures history and report input
        run: python -m china_commodities.cli report-input --repair-futures-history

      - name: Upload raw diagnostic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commodity-options-${{ github.run_id }}
          path: |
            data/raw/
            data/scoped/*/raw/
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate full-market snapshot
        if: ${{ steps.collection_plan.outputs.validate_full_market == 'true' }}
        run: python -m china_commodities.cli validate

      - name: Commit and push data changes
        shell: bash
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update daily commodity snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
