name: Daily China Commodities Data

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD); defaults to runner date"
        required: false
        type: string
  schedule:
    # 18:15 Asia/Shanghai, Monday through Friday.
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-china-commodities
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install project
        run: python -m pip install --no-deps -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Acquire one shared iFinD access token
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        run: python scripts/export_ifind_access_token.py

      - name: Collect verified full-market iFinD futures
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${IFIND_REFRESH_TOKEN}" ]]; then
            echo "IFIND_REFRESH_TOKEN secret is required." >&2
            exit 1
          fi
          if [[ -n "${TRADE_DATE}" ]]; then
            python -m china_commodities.cli run --date "${TRADE_DATE}" --provider ifind --skip-options
          else
            python -m china_commodities.cli run --provider ifind --skip-options
          fi

      - name: Collect all catalog commodity option chains
        continue-on-error: true
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${TRADE_DATE}" ]]; then
            python scripts/collect_ifind_options.py --all-products --date "${TRADE_DATE}"
          else
            python scripts/collect_ifind_options.py --all-products
          fi

      - name: Upload raw diagnostic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commodity-options-${{ github.run_id }}
          path: |
            data/raw/
            data/scoped/*/raw/
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate full-market snapshot
        run: python -m china_commodities.cli validate

      - name: Commit and push data changes
        shell: bash
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update daily commodity snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
