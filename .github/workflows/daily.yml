name: Silver research canary (isolated branch)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe existing iFinD historical minute entitlement
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, time
          BASE="https://quantapi.51ifind.com/api/v1/"
          def post(endpoint, payload, headers):
              req=urllib.request.Request(BASE+endpoint,data=json.dumps(payload).encode() if payload is not None else None,method="POST",headers={"Content-Type":"application/json",**headers})
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          a=post("get_access_token",None,{"refresh_token":os.environ["IFIND_REFRESH_TOKEN"]})
          token=(a.get("data") or {}).get("access_token")
          if not token:
              print(json.dumps({"stage":"authentication","errorcode":a.get("errorcode"),"authenticated":False})); raise SystemExit(1)
          print("Authenticated; token retained in process memory only.")
          for code,date in [("AG2612.SHF","2026-11-05"),("AG2512.SHF","2025-11-05"),("AG2312.SHF","2023-11-06"),("AG2112.SHF","2021-11-05")]:
              p={"codes":code,"indicators":"open,high,low,close,volume","starttime":date+" 09:00:00","endtime":date+" 15:00:00","functionpara":{"Interval":"5","Fill":"Original","CPS":"no"}}
              try:
                  d=post("high_frequency",p,{"access_token":token})
                  tables=d.get("tables") or []
                  print(json.dumps({"code":code,"date":date,"errorcode":d.get("errorcode"),"errmsg":str(d.get("errmsg",""))[:200],"dataVol":d.get("dataVol"),"tables":[{"code":t.get("thscode"),"rows":len(t.get("time",[])),"first":(t.get("time") or [None])[0],"last":(t.get("time") or [None])[-1],"fields":list((t.get("table") or {}).keys())} for t in tables]},ensure_ascii=False))
              except Exception as e: print(json.dumps({"code":code,"date":date,"error_type":type(e).__name__}))
              time.sleep(1)
          
          PY
