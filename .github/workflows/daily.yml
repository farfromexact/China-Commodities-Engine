name: Isolated Core Options Live Comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-core-options-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Validate core behavior
        run: python -m unittest discover -s tests -p 'test_option_*.py' -q
      - name: Run one measured core collection
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        run: python -u scripts/compare_option_core.py --output tmp/core-live-trial/output
      - name: Upload comparison and isolated data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-options-live-comparison
          path: tmp/core-live-trial/output/
          retention-days: 14
          if-no-files-found: warn
